# Settings of the app under test and the Appium connection. Passed to a run with -Ppom.env=<path>.
# No secrets here: credentials and API keys come from environment variables (see README).

# Appium server URL; %s is replaced with the Appium port (-Ppom.appiumPort, default 4723)
urlHost=http://127.0.0.1:%s

# --- Android ---
# package and launch activity of the app under test (UNVERIFIED for the demo app - check with
# "adb shell cmd package resolve-activity --brief org.wikipedia")
appPackage=org.wikipedia
appActivity=org.wikipedia.main.MainActivity

# --- iOS ---
iosBundleId=org.wikimedia.wikipedia
# optional .ipa/.app to reinstall before every session for a clean app state; empty = use the installed app
iosAppPath=
# optional WebDriverAgent bundle id for a real device, signed with your team (see pom.xcodeOrgId in README)
iosWdaBundleId=

# --- Self-healing locators (opt-in) ---
# true = a locator that stops matching is repaired through the Claude API; needs ANTHROPIC_API_KEY
selfHealing=false
